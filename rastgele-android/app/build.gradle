plugins { id 'com.android.application' }

android {
    namespace 'com.elmlfo.rastgele'
    compileSdk 35
    defaultConfig {
        applicationId 'com.elmlfo.rastgele'
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty('vc') ?: '1') as int
        versionName (project.findProperty('vn') ?: '1.0')
    }
    signingConfigs {
        rel {
            storeFile file('../rastgele.keystore')
            storePassword 'rastgele-2026'
            keyAlias 'rastgele'
            keyPassword 'rastgele-2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.rel
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
