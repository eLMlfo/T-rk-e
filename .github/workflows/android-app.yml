# SPDX-License-Identifier: AGPL-3.0-only
# Telefon/tablet uygulaması (couchsubs-android): JVM testleri ve hata ayıklama APK'sı. Öneri aşamasında: yalnız bu klasör
# değişince ve elle çalışır; sürüm iş akışına (release.yml) henüz bağlı değildir. İmza, TV uygulamasıyla aynı sırlardan
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD) yapılabilir; şimdilik geliştirme anahtarıyla imzalanır.
name: android-app

permissions:
  contents: write

on:
  push:
    branches: [main, "feat/android-*"]
    # tv-webos ve tv-tizen: telefondan kurulum için uygulamaya gömülen Samsung paketi bunlardan derlenir.
    paths: ["couchsubs-android/**", "core/Sources/CouchSubsCore/Resources/**", "tv-webos/**", "tv-tizen/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      # TV paketleri (Android TV APK) son sürümden indirilir; CI'da indirilemezse derleme durur.
      - name: JVM testleri (paket anahtarı, kararlılık, SSE biçimi, TV kurulumu)
        working-directory: couchsubs-android
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gradle testDebugUnitTest -Pcouchsubs.skipNative=true -Pcouchsubs.requireTvPackages=true --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-app-test-report
          path: couchsubs-android/app/build/reports/tests

  apk:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: chiaki-ng ve gereken alt modüller
        run: |
          git submodule update --init --depth 1 third-party/chiaki-ng
          git -C third-party/chiaki-ng submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      # nanopb'nin kod üreteci protobuf paketli Python ister; chiaki-ng'nin takion.proto'su için protoc gerekir.
      - name: Python ve protoc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler > /dev/null
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet protobuf grpcio-tools
          echo "COUCHSUBS_PYTHON=$RUNNER_TEMP/venv/bin/python3" >> "$GITHUB_ENV"
      - name: NDK ve CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Telefon içi ses motoru (pocket-tts, MIT)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p couchsubs-android/app/src/main/jniLibs/arm64-v8a
          gh release download tts-engine -R "$GITHUB_REPOSITORY" -p libpockettts.so -p "libc++_shared.so" -D couchsubs-android/app/src/main/jniLibs/arm64-v8a
          ls -la couchsubs-android/app/src/main/jniLibs/arm64-v8a
      - name: Derle
        working-directory: couchsubs-android
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Kişisel yapı: sabit anahtar, böylece yeni sürüm eskisinin üstüne kurulur.
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/couchsubs-android/sesli.keystore
          ANDROID_KEYSTORE_PASSWORD: sesli-couchsubs-2026
          ANDROID_KEY_ALIAS: couchsubs
        run: |
          gradle assembleRelease -Pcouchsubs.versionCode=${{ github.run_number }}00 -Pcouchsubs.versionName=sesli-${{ github.run_number }} -Pcouchsubs.patchChiaki=true -Pcouchsubs.requireTvPackages=true --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/CouchSubs-sesli.apk
      - name: APK'yı doğrula
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs dist/CouchSubs-sesli.apk
          "$BT/aapt2" dump badging dist/CouchSubs-sesli.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: couchsubs-android-app
          path: dist/*.apk
          if-no-files-found: error
      - name: APK'yı sürüm olarak yayınla (telefondan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sesli -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create sesli dist/CouchSubs-sesli.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CouchSubs + Türkçe sesli okuma" --notes "Telefon uygulaması. Ayarlar > Profil > 'Türkçeyi sesli oku'."
