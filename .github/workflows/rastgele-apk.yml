# Rastgele balık uygulaması: APK derler ve "rastgele-apk" sürümüne Rastgele.apk olarak koyar.
name: rastgele-apk

permissions:
  contents: write

on:
  push:
    branches: [rastgele]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Derle
        working-directory: rastgele-android
        run: |
          gradle assembleRelease -Pvc=${{ github.run_number }} -Pvn=1.${{ github.run_number }} --no-daemon
          mkdir -p ../dist && cp app/build/outputs/apk/release/*.apk ../dist/Rastgele.apk
      - name: APK'yı doğrula
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs dist/Rastgele.apk
          "$BT/aapt2" dump badging dist/Rastgele.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: Rastgele-apk
          path: dist/Rastgele.apk
      - name: Sürüm olarak yayınla (telefondan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rastgele-apk -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create rastgele-apk dist/Rastgele.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Rastgele — Balık Saati (Android)" \
            --notes "Manavgat kıyısı için balık tahmini: canlı rüzgar ve dalga, GPS ile yakındaki meralar, av defteri. Sürüm 1.${{ github.run_number }}."
